name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentguard_test
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentguard -d agentguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTGUARD_TEST_DATABASE_URL: postgresql://agentguard:agentguard@localhost:5432/agentguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=agentguard --cov-report=term-missing

  rego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test OPA policies
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/policy:/policies:ro"
          openpolicyagent/opa:1.17.0-static
          test /policies -v

