name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps with secrets and personal data removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentGuard version or commit
    validations:
      required: true

