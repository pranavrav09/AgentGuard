services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  opa:
    image: openpolicyagent/opa:1.17.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "8181:8181"
    volumes:
      - ./policy:/policies:ro

  api:
    build: .
    command: ["agentguard-api"]
    environment:
      AGENTGUARD_DATABASE_URL: postgresql://agentguard:agentguard@postgres:5432/agentguard
      AGENTGUARD_OPA_URL: http://opa:8181
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  secureguard:
    build: .
    command: ["agentguard-worker"]
    environment:
      AGENTGUARD_DATABASE_URL: postgresql://agentguard:agentguard@postgres:5432/agentguard
      AGENTGUARD_WORKER_ID: secureguard-compose
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
